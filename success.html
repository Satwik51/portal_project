<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Attendance marked successfully.">
  <meta name="theme-color" content="#003366">
  <title>Attendance Success</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="assets/website_background/background_image_website.png">
  <link rel="preload" as="image" href="assets/logo/bhu_logo.png">
  <link rel="preload" as="image" href="assets/logo/mmv__bhu_logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/bundle.css">
</head>
<body>
  <header>
    <img src="assets/logo/bhu_logo.png" alt="BHU Logo" class="header-logo" width="80" height="80" fetchpriority="high" decoding="sync">
    <div class="header-title-container">
      <div class="header-college-name">Mahila Mahavidyalaya, BHU</div>
      <div class="header-portal-title">Department of Vocal Music, Instrumental Music and Dance</div>
    </div>
    <img src="assets/logo/mmv__bhu_logo.png" alt="MMV Logo" class="header-logo" width="80" height="80" fetchpriority="high" decoding="sync">
  </header>

  <main>
    <div class="card">
      <div class="success-icon" style="background:#008000;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      
      <div class="text-center">
        <h1 class="card-title" style="color:#008000; border-bottom:2px solid #ccc; padding-bottom:10px; margin-bottom:10px;">ATTENDANCE MARKED SUCCESSFULLY</h1>
        <p style="color:var(--color-text-muted); font-size:13px; font-weight:bold;">Please keep this confirmation for your records.</p>
      </div>

      <div class="attendance-details" id="detailsContainer" style="background:#f9f9f9; padding:15px; border:1px solid #ddd;">
        <!-- JS will populate this -->
      </div>

      <div style="text-align: center; margin-top: 25px; margin-bottom: 10px;">
        <button onclick="window.location.href='index.html'" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; letter-spacing: 1px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          DONE
        </button>
      </div>
    </div>
  </main>
  
    <footer>
      <p>Designed, Developed and Hosted by Students, Mahila Mahavidyalaya, Banaras Hindu University.</p>
      <p>&copy; 2026 All Rights Reserved.</p>
    </footer>

  <script type="module">
    import { formatDate } from './js/utils.js';
    document.addEventListener('DOMContentLoaded', () => {
      const recordStr = localStorage.getItem('latest_attendance');
      if (recordStr) {
        const r = JSON.parse(recordStr);
        document.getElementById('detailsContainer').innerHTML = `
          <div class="event-info-item">
            <span class="event-info-label">Student Name</span>
            <span class="event-info-value" style="font-weight:bold; font-size:1.1rem; color:#003366;">${r.student_name}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Enrollment Number</span>
            <span class="event-info-value" style="font-weight:bold;">${r.enrollment_number}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Course</span>
            <span class="event-info-value">${r.course}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Event</span>
            <span class="event-info-value" id="displayEvent">${r.event_name}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Session</span>
            <span class="event-info-value">${r.day} - ${r.session_name}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Attendance Time</span>
            <span class="event-info-value" style="color:#008000; font-weight:bold;">${formatDate(r.timestamp)}</span>
          </div>
          <div class="event-info-item">
            <span class="event-info-label">Attendance ID</span>
            <span class="event-info-value" style="font-family:monospace; font-weight:bold; font-size:16px;">${r.attendanceId}</span>
          </div>
        `;
        
        const adminRecs = JSON.parse(localStorage.getItem('admin_mock_records') || '[]');
        if (!adminRecs.some(rec => rec.attendanceId === r.attendanceId)) {
            adminRecs.push(r);
            localStorage.setItem('admin_mock_records', JSON.stringify(adminRecs));
        }
      }
    });
  </script>
</body>
</html>
